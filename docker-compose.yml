# URL do RTDB (mesmo valor do databaseURL em frontend/src/firebaseConfig.ts) e storage
# do rate limiter (Redis), compartilhado entre as instâncias.
x-backend-env: &backend-env
  FIREBASE_DB_URL: https://coursesphere-andreywid-default-rtdb.firebaseio.com
  RATELIMIT_STORAGE_URI: redis://redis:6379

# Config comum das instâncias: mesma imagem e mesmos segredos (somente leitura),
# sem publicar a 5000 (só o Nginx publica). create_host_path: false faz o compose
# falhar se um segredo faltar, em vez de criar um diretório vazio no lugar.
x-backend: &backend
  build: ./backend
  expose:
    - "5000"
  volumes:
    - type: bind
      source: ./backend/config.json
      target: /app/config.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./backend/credentials.json
      target: /app/credentials.json
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    redis:
      condition: service_healthy
  networks:
    - coursesphere-net

services:
  backend1:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend1

  backend2:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_NAME: backend2

  # Único serviço que publica a 5000; balanceia backend1/backend2.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "5000:5000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - coursesphere-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    networks:
      - coursesphere-net

  # --- Observabilidade (ambiente de teste; em produção seriam serviços gerenciados/internos) ---

  # Store do rate limiter, compartilhado entre as instâncias (limite global).
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - coursesphere-net

  # Raspa /metrics de backend1 e backend2 direto (não via Nginx).
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - coursesphere-net

  # Dashboard provisionado (datasource e painéis via arquivos, sem clique manual).
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - coursesphere-net

networks:
  coursesphere-net:
    name: coursesphere-net
    driver: bridge
