name: security

# SAST e SCA a cada push e pull_request, automatizando o que foi feito manual na Fase 2.
# Modo report: os jobs não bloqueiam o merge (continue-on-error), porque o projeto tem
# achados herdados já rastreados (ACH-xx). Para virar gate bloqueante, é só remover o
# continue-on-error (ou usar --error no Semgrep e --audit-level no npm).
# Nenhum job usa segredos, sobe a aplicação ou toca o Firebase: só instalam ferramentas
# e analisam os arquivos do repositório.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # SAST — Semgrep em backend/ e frontend/src
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # para enviar o SARIF à aba Security (best-effort)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Semgrep (report)
        continue-on-error: true
        run: >
          semgrep scan
          --config p/python --config p/flask --config p/javascript
          --sarif --output semgrep.sarif
          backend frontend/src
      - name: Enviar SARIF para a aba Security
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif

  # SAST — Bandit no backend (opcional)
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Bandit (report)
        continue-on-error: true
        run: bandit -r backend -x backend/cornell-course-sphere-data -f json -o bandit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit.json

  # SCA — dependências do backend
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (report)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt --desc on

  # SCA — dependências do frontend (usa o package-lock.json)
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (report, falha só em high+)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
